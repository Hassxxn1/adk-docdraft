# Render Blueprint: deploys the ADK Document Portal from this GitHub repository.
# In Render: New → Blueprint → choose this repository. Then fill in the values marked "sync: false".
services:
  - type: web
    name: adk-document-portal
    runtime: node
    region: singapore
    plan: starter            # a paid plan is needed for the persistent disk below
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: docportal-data
      mountPath: /var/data   # database, issued Word files and signed scans live here
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false          # e.g. https://policies.adkhospital.com
      - key: ADMIN_EMAIL
        sync: false          # first Super Admin's e-mail
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_DESIGNATION
        sync: false
      - key: ADMIN_PASSWORD
        sync: false          # temporary; delete after the first sign-in
      - key: ANTHROPIC_API_KEY
        sync: false
