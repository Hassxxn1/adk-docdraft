<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Portal · ADK Hospital</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a href="#/" class="brand"><img src="/assets/logo.png" alt="ADK Hospital" class="logo"></a>
      <div class="top-title">
        <span class="eyebrow">Document Governance</span>
        <span class="app-name">Document Portal</span>
      </div>
      <nav class="nav" id="nav">
        <a href="#/" data-nav="work">My work</a>
        <a href="#/new" data-nav="new">New document</a>
        <a href="#/register" data-nav="register">Register</a>
      </nav>
      <div class="user"><span id="userName"></span><span id="hrBadge" class="badge" hidden>HR</span><a href="/logout">Sign out</a></div>
    </div>
  </header>

  <main id="view" class="wrap"><p class="loading">Loading…</p></main>
  <div id="toast" role="status" hidden></div>

  <template id="tpl-new">
    <div class="layout">
    <form id="form" novalidate>
      <h1 class="page-title">New document</h1>
      <p class="lead">Complete the form and the portal drafts your document in the ADK master template. You then edit it in the portal, name the reviewers and approvers, and submit it. HR assigns the number when all approvals are in.</p>
      <div id="aiNote" class="notice" hidden>AI drafting is not switched on yet. The portal will lay your text into the master template without rewriting it.</div>

      <section class="card">
        <h2><span class="step">1</span>Document details</h2>
        <div class="grid">
          <label class="full">Document type
            <select name="docType" id="docType" required><option value="">Choose…</option></select>
          </label>
          <label class="full" id="variantWrap" hidden><span id="variantLabel">Type</span>
            <select name="variant" id="variant"></select>
          </label>
          <label class="full">Document title
            <input name="title" required maxlength="200" placeholder="e.g. Hand Hygiene Compliance Audit">
          </label>
          <label>Owning department
            <select name="deptCode" id="deptCode" required><option value="">Choose…</option></select>
          </label>
          <label>Document owner
            <input name="owner" maxlength="200" placeholder="Name, designation">
          </label>
          <label class="full">Applies to
            <input name="appliesTo" maxlength="500" placeholder="e.g. All nursing staff in inpatient wards">
          </label>
          <label data-show="sop">Parent policy ID
            <input name="parentPolicy" maxlength="200" placeholder="e.g. QSD-POL-002-V1">
          </label>
          <label data-show="directive">Effective from
            <input type="date" name="effectiveFrom">
          </label>
          <label data-show="directive">Expiry or review date <em>required</em>
            <input type="date" name="expiry">
          </label>
          <label>Confidentiality level
            <select name="confidentiality"><option>Internal Use</option><option>Public</option><option>Confidential</option><option>Highly Confidential</option></select>
          </label>
          <label>Your designation <em>required</em>
            <input name="authorDesignation" maxlength="120" placeholder="e.g. Director of Nursing">
          </label>
          <label>How will it be signed?
            <select name="signMethod"><option value="electronic">Approved electronically in the portal</option><option value="wet">Printed and signed by hand</option></select>
          </label>
          <label id="clinicalWrap">Clinical impact
            <select name="clinicalImpact"><option>No</option><option>Yes</option></select>
          </label>
        </div>
      </section>

      <section class="card">
        <h2><span class="step">2</span>Content</h2>
        <p class="hint">Write in your own words. Short notes and bullet points are fine. Put each item on its own line.</p>

        <label>Purpose <em>required</em>
          <textarea name="purpose" rows="3" placeholder="What should this document achieve, and why does the hospital need it?"></textarea>
        </label>
        <label data-show="directive">Reason for the directive <em>required</em>
          <textarea name="background" rows="3" placeholder="What has happened or changed, and why an urgent instruction is needed now."></textarea>
        </label>
        <label><span id="scopeLabel">Scope</span>
          <textarea name="scope" rows="3" placeholder="Who and what it covers. Anything it does not cover."></textarea>
        </label>
        <label>Definitions
          <textarea name="definitions" rows="3" placeholder="Term: meaning&#10;HCW: Healthcare worker"></textarea>
        </label>

        <label data-show="policy">Policy requirements <em>required</em>
          <textarea name="statements" rows="7" placeholder="The rules staff must follow, one per line.&#10;All staff perform hand hygiene before and after patient contact.&#10;Each ward completes a monthly hand hygiene audit."></textarea>
        </label>

        <label data-show="guideline">Recommended practice <em>required</em>
          <textarea name="guidance" rows="8" placeholder="The good practice you recommend, one point per line. Group under a topic heading if useful.&#10;Patient handover: use the SBAR structure for verbal handover.&#10;Patient handover: hand over at the bedside where possible."></textarea>
        </label>

        <label data-show="directive">Instructions <em>required</em>
          <textarea name="instructions" rows="6" placeholder="What staff must do from the effective date, one instruction per line."></textarea>
        </label>
        <label data-show="directive">Conversion to a formal document
          <textarea name="conversion" rows="2" placeholder="Will this become a policy, SOP, protocol or guideline? By when, and who drafts it?"></textarea>
        </label>

        <label data-show="form">Form fields <em>required</em>
          <textarea name="formFields" rows="8" placeholder="Each field on its own line, as Field: what to enter. Add a section heading line ending in a colon if useful.&#10;Patient MRN: hospital record number from HIS&#10;Date of incident: date the event happened&#10;Description: what happened, in factual terms"></textarea>
        </label>
        <label data-show="form">How to complete and submit
          <textarea name="completion" rows="3" placeholder="Who completes it, when, who signs it, and where it is sent."></textarea>
        </label>

        <label data-show="sop">Prerequisites
          <textarea name="prerequisites" rows="3" placeholder="Equipment, systems, forms or competencies needed before starting."></textarea>
        </label>
        <label data-show="sop">Procedure steps <em>required</em>
          <textarea name="procedure" rows="9" placeholder="The steps in order, one per line. Say who does each step.&#10;Ward manager selects 10 random observation opportunities.&#10;Auditor records each observation on the audit form.&#10;If compliance is below 80%, ward manager starts an action plan."></textarea>
        </label>
        <label data-show="sop form">Records
          <textarea name="records" rows="3" placeholder="Forms or registers completed, who keeps them, and for how long."></textarea>
        </label>

        <label data-show="policy sop guideline directive">Roles and responsibilities
          <textarea name="roles" rows="4" placeholder="Role: what they do&#10;Ward manager: ensures audits are completed monthly"></textarea>
        </label>
        <label data-show="policy sop">Monitoring and compliance
          <textarea name="monitoring" rows="3" placeholder="How you will know it is followed: indicators, audits, who reports, to which committee."></textarea>
        </label>
        <label data-show="policy sop guideline directive">Training and implementation
          <textarea name="training" rows="3" placeholder="Briefing, training or competency checks needed before go-live."></textarea>
        </label>
        <label>Related ADK documents
          <textarea name="related" rows="2" placeholder="Document IDs, one per line."></textarea>
        </label>
        <label data-show="policy sop guideline directive">References
          <textarea name="references" rows="2" placeholder="Laws, regulations, Ministry of Health or accreditation standards, cited exactly."></textarea>
        </label>
        <label>Anything else the drafter should know
          <textarea name="notes" rows="2"></textarea>
        </label>
      </section>

      <div class="actions">
        <button type="submit" id="submit">Create draft</button>
        <button type="button" id="clear" class="ghost">Clear form</button>
        <span id="status" role="status"></span>
      </div>
    </form>

    <aside class="side">
      <div class="side-card" id="summary">
        <div class="band" id="band"><span id="bandLevel">Choose a document type</span><strong id="bandType"></strong></div>
        <dl>
          <dt>Document ID</dt><dd id="sumId">—</dd>
          <dt>Review cycle</dt><dd id="sumReview">—</dd>
          <dt>Final approval</dt><dd id="sumApproval">—</dd>
        </dl>
        <p class="small">HR assigns the number and version on issue. The draft is not valid until approved and issued by HR.</p>
      </div>
      <div class="side-card">
        <h3>What happens next</h3>
        <ol class="small">
          <li>The portal drafts the document. You edit it and resolve every highlighted item.</li>
          <li>You name each reviewer and approver, with their designation.</li>
          <li>Each one opens the document in the portal, checks their details, and approves or returns it.</li>
          <li>HR verifies the approvals and assigns the document number.</li>
          <li>Electronic: issued at once. Signed by hand: print the FINAL copy, collect signatures, and HR uploads the signed scan.</li>
        </ol>
      </div>
      <p class="small muted">Never enter patient-identifiable information in this form.</p>
    </aside>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
