# Static site: no build step. Publish the repository root.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Keep the repo's housekeeping files off the public site.
[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
